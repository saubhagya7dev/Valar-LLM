[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "valar-llm"
version = "0.1.0"
description = "Evidence-grounded task contracts and feasibility tools for Valar LLM"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = ["pydantic>=2.12,<3", "jsonschema>=4.25,<5", "pillow>=11.3,<13"]

[project.scripts]
valar = "valar_llm.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/valar_llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
